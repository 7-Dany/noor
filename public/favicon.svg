<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 49 49" fill="none">
  <style>
    .moon { display: none; }
    @media (prefers-color-scheme: dark) {
      .sun { display: none; }
      .moon { display: inline; }
    }
  </style>

  <!-- Sun: same disc and rays as components/icons/sun.tsx -->
  <g class="sun" stroke="#e9a912" stroke-width="2.4">
    <path
      fill="#edaa25"
      d="M24.5 33.074a8.575 8.575 0 1 0 0-17.149 8.575 8.575 0 0 0 0 17.15Z"
    />
    <path
      stroke-linecap="round"
      d="M37.975 24.5H44.1m-10.072 9.528 4.331 4.331M24.5 37.975V44.1m-9.529-10.072-4.33 4.331m.384-13.859H4.9m10.071-9.528-4.33-4.331m13.859.384V4.9m9.528 10.072 4.331-4.331"
    />
  </g>

  <!-- Moon: shown instead of the sun when the OS is in dark mode -->
  <g class="moon">
    <circle cx="24.5" cy="24.5" r="19" fill="#cfc4b3" />
    <g fill="#a99e8d">
      <circle cx="18" cy="18" r="3.4" />
      <circle cx="30.5" cy="29.5" r="4.6" />
      <circle cx="17.5" cy="31" r="2.2" />
      <circle cx="31" cy="17" r="1.9" />
    </g>
  </g>
</svg>
